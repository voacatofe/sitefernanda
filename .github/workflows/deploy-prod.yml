name: Deploy to Production

# Workflow para deploy em produção via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build project
        run: pnpm build
      
      - name: Prepare for deployment
        run: |
          mkdir -p .deploy
          cp -r .next/standalone/* .deploy/
          cp -r .next/static .deploy/.next/
          cp -r public .deploy/
          # Criar arquivo .htaccess para configurar redirecionamento de servidor
          echo "DirectoryIndex server.js" > .deploy/.htaccess
          echo "RewriteEngine On" >> .deploy/.htaccess
          echo "RewriteRule ^$ server.js [L]" >> .deploy/.htaccess
          echo "RewriteCond %{REQUEST_FILENAME} !-f" >> .deploy/.htaccess
          echo "RewriteCond %{REQUEST_FILENAME} !-d" >> .deploy/.htaccess
          echo "RewriteRule ^(.*)$ server.js [L]" >> .deploy/.htaccess
          # Criar um wrapper PHP para executar o Node.js (necessário em muitos hosts compartilhados)
          echo "<?php" > .deploy/index.php
          echo "header('Location: /server.js');" >> .deploy/index.php
          echo "exit();" >> .deploy/index.php
          # Gerar um arquivo .user.ini para configurar PHP
          echo "engine = On" > .deploy/.user.ini
          echo "short_open_tag = On" >> .deploy/.user.ini
          # Criar arquivo .htaccess dentro da pasta .next
          mkdir -p .deploy/.next
          echo "Options +Indexes" > .deploy/.next/.htaccess
          echo "Order allow,deny" >> .deploy/.next/.htaccess
          echo "Allow from all" >> .deploy/.next/.htaccess
      
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: fernandasoaresimoveis.com.br
          username: u491560244.darlan
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.deploy/
          server-dir: /
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-prod.json
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md 