name: Deploy to Production

# Workflow para deploy em produção via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build project
        run: pnpm build
      
      - name: Prepare for deployment
        run: |
          mkdir -p .deploy
          
          # Criar página temporária de manutenção
          echo '<!DOCTYPE html>' > .deploy/index.html
          echo '<html lang="pt-BR">' >> .deploy/index.html
          echo '<head>' >> .deploy/index.html
          echo '  <meta charset="UTF-8">' >> .deploy/index.html
          echo '  <meta name="viewport" content="width=device-width, initial-scale=1.0">' >> .deploy/index.html
          echo '  <title>Fernanda Soares Imóveis - Em Breve</title>' >> .deploy/index.html
          echo '  <style>' >> .deploy/index.html
          echo '    body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; text-align: center; background-color: #f5f5f5; }' >> .deploy/index.html
          echo '    .container { max-width: 800px; padding: 40px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }' >> .deploy/index.html
          echo '    h1 { color: #333; font-size: 2.5rem; margin-bottom: 20px; }' >> .deploy/index.html
          echo '    p { color: #666; font-size: 1.2rem; margin-bottom: 30px; }' >> .deploy/index.html
          echo '    .contact { margin-top: 30px; font-weight: bold; }' >> .deploy/index.html
          echo '    .logo { margin-bottom: 30px; font-size: 2.8rem; font-weight: bold; color: #333; }' >> .deploy/index.html
          echo '  </style>' >> .deploy/index.html
          echo '</head>' >> .deploy/index.html
          echo '<body>' >> .deploy/index.html
          echo '  <div class="container">' >> .deploy/index.html
          echo '    <div class="logo">Fernanda Soares Imóveis</div>' >> .deploy/index.html
          echo '    <h1>Site em construção</h1>' >> .deploy/index.html
          echo '    <p>Estamos trabalhando para trazer a melhor experiência imobiliária para você. Nosso novo site estará disponível em breve!</p>' >> .deploy/index.html
          echo '    <p>Enquanto isso, você pode entrar em contato conosco pelos meios abaixo:</p>' >> .deploy/index.html
          echo '    <div class="contact">' >> .deploy/index.html
          echo '      <p>Telefone: (xx) xxxxx-xxxx</p>' >> .deploy/index.html
          echo '      <p>Email: contato@fernandasoaresimoveis.com.br</p>' >> .deploy/index.html
          echo '    </div>' >> .deploy/index.html
          echo '  </div>' >> .deploy/index.html
          echo '</body>' >> .deploy/index.html
          echo '</html>' >> .deploy/index.html
          
          # Copiar arquivos estáticos se houver
          cp -r public/* .deploy/ || true
          
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: fernandasoaresimoveis.com.br
          username: u491560244.darlan
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.deploy/
          server-dir: /
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-prod.json
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md 