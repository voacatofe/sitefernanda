name: Deploy to Development

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: fernandasoaresimoveis.com.br
          username: u491560244.darlan	
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: public_html/dev/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md 